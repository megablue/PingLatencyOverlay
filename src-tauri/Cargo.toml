[workspace]
members = ["crates/core", "crates/tray"]
# Required, not decoration. A manifest that is both a workspace root and a
# package makes plain `cargo test` operate on THAT PACKAGE ALONE, so without
# this line the 59 tests in `core` are silently skipped and the command still
# exits 0. It reported "35 passed" against a 94-test suite. Listing the root
# explicitly makes the ordinary command cover the whole workspace.
default-members = [".", "crates/core", "crates/tray"]

[package]
name = "ping-latency-overlay"
# `cargo run` with two binaries in the workspace is ambiguous, and it is
# ambiguous precisely where a developer starts the app. The window is the one
# that was run before the split, and it starts whatever it needs, so it keeps
# the default. The tray and the renderer are named explicitly when wanted.
default-run = "plo-config"
# The build version is MAJOR.MINOR.(commits since countBase below), not this
# patch number. Raise the minor here when the minor changes; the patch is
# derived from Git and the two readers of this file both read countBase from
# here too, so the app and the installer cannot disagree about the number.
version = "0.2.0"
description = "Windows overlay showing live network latency"
authors = ["megablue"]
license = "GPL-3.0-only"
repository = "https://github.com/megablue/PingLatencyOverlay"
edition = "2021"
rust-version = "1.88"

# The single source of truth for where the patch number starts. `build.rs`
# (which sets the version the app shows) and `scripts/build-nsis.ps1` (which
# names the installer) both subtract this from the Git commit count, so a
# disagreement between the app and its own filename is not expressible. It
# was 76 when the minor moved from 1 to 2: the split into two processes
# rewrote how the app starts, so it gets a new minor, and the count restarts.
[package.metadata.build]
countBase = 76

[lib]
name = "ping_latency_overlay_lib"
crate-type = ["rlib"]

# The binary is the configuration window, and it is named for what it is. It
# used to be `ping-latency-overlay.exe` and it was the tray as well, back when
# the tray icon and the window shared a process and the process therefore
# carried eframe whether or not the window was open. They are separate
# processes now, so the name says which one this is: the tray is `plo-tray.exe`
# and the renderer is `plo-renderer.exe`. A user who finds this executable and
# runs it gets the window, which by itself starts the tray and the renderer if
# they are not already up.
#
# The three are short on purpose. They sit side by side in the install folder
# and next to each other in Task Manager, and a name long enough to need
# abbreviating is a name that is hard to tell apart from the next one at a
# glance -- which is exactly the sort of thing this app's whole design is
# trying to avoid. The product name, the installer's file name, the Start Menu
# folder and the window title are all still PingLatencyOverlay; only the
# executables are terse.
[[bin]]
name = "plo-config"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1.17"

# This package is the application shell: the tray icon and the one egui
# configuration window. It is the only thing that may depend on a GUI stack.
#
# Probing, the graph renderer and the layered overlay windows live in
# `crates/core`, which has no GUI dependency at all, so a renderer process can
# be built from it later without a GPU context. See that crate's manifest for
# the rule and for the test that enforces it.
#
# What is left here is only what the shell itself touches:
#   eframe / image    the configuration window, its window icon and the About
#                     page's logo
#   tray-icon         the system tray icon and its menu
#   tokio             the runtime the probe manager is driven on
#   windows-sys       `ShellExecuteW`, to hand a URL to the user's browser
#   log               shell diagnostics
#   env_logger        `run()` initialises the logger once at startup
[dependencies]
ping-latency-overlay-core = { path = "crates/core" }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow"] }
tray-icon = "0.25.1"
image = { version = "0.25", default-features = false, features = ["png"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
# `ShellExecuteW` is how Windows hands a URL to the user's browser. eframe's
# NATIVE runner ignores `egui::OutputCommand::OpenUrl` (only its web runner
# acts on it), so the app has to open the URL itself. Pinned to a version
# already in the lock file so no second copy of the crate is compiled.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
log = "0.4"
env_logger = "0.11"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
