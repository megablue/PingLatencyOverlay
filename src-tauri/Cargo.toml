[package]
name = "ping-latency-overlay"
version = "0.1.0"
description = "Windows overlay showing live network latency"
authors = ["you"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "ping_latency_overlay_lib"
crate-type = ["rlib"]

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow"] }
tray-icon = "0.25.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
ping-rs = "0.1"
dirs = "5"
log = "0.4"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
tiny-skia = "0.11.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
