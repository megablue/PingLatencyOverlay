[package]
name = "ping-latency-overlay"
version = "0.1.0"
description = "Windows overlay showing live network latency"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ping_latency_overlay_lib"
# Desktop-only app: rlib only. `staticlib`/`cdylib` exist for mobile targets and
# add ~1 GB to the debug build (a giant .lib/.dll + extra PDBs).
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
ping-rs = "0.1"
dirs = "5"
log = "0.4"
env_logger = "0.11"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
